[package]
name = "inviscid"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0"

[lib]
name = "inviscid"
path = "src/lib.rs"

[[bin]]
name = "inviscid"
path = "src/main.rs"
test = false

[dependencies]
anyhow = "1.0"
dirs = "7.0.0"
fontdb = "0.23"
futures = "0.3"
gpui = "0.2.2"
gpui_sum_tree = "0.2.2"
latex-rust = "3.0.1"
ttf-parser = "0.25"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
parking_lot = "0.12"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.6"
ureq = { version = "3.4.2", features = ["rustls"] }
rust-embed = { version = "8", features = ["include-exclude"] }
trash = { version = "5.2.9", default-features = false, features = [
    "coinit_apartmentthreaded",
] }
tree-sitter = { version = "0.27", features = ["wasm"] }
wasmtime = { version = "48.0", default-features = false, features = ["cache"] }
tempfile = "3.27"

# Search functionality
regex = "1.10"
memchr = "2.7"
ignore = "0.4"
notify = "8.2"
ropey = "1.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }

[patch.crates-io]
# Run python patches/gpui/prepare.py first; see patches/gpui/README.md.
gpui = { path = "vendor/gpui" }

[build-dependencies]
embed-resource = "3.0.12"
image = { version = "0.25.10", default-features = false, features = ["ico"] }
resvg = { version = "0.49.0", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Optimize cold compiler, cached diagram/math/SVG, image-decoder, TLS/network, and config crates for size;
# keep core UI, layout, rope editing, syntax, and search crates at opt-level = 3.
[profile.release.package.cranelift-codegen]
opt-level = "z"
[profile.release.package.cranelift-assembler-x64]
opt-level = "z"
[profile.release.package.cranelift-frontend]
opt-level = "z"
[profile.release.package.cranelift-native]
opt-level = "z"
[profile.release.package.cranelift-bforest]
opt-level = "z"
[profile.release.package.cranelift-entity]
opt-level = "z"
[profile.release.package.cranelift-control]
opt-level = "z"
[profile.release.package.cranelift-bitset]
opt-level = "z"
[profile.release.package.wasmtime]
opt-level = "z"
[profile.release.package.wasmtime-c-api-impl]
opt-level = "z"
[profile.release.package.wasmtime-environ]
opt-level = "z"
[profile.release.package.wasmtime-internal-cranelift]
opt-level = "z"
[profile.release.package.wasmtime-internal-core]
opt-level = "z"
[profile.release.package.wasmtime-internal-cache]
opt-level = "z"
[profile.release.package.wasmtime-internal-unwinder]
opt-level = "z"
[profile.release.package.wasmtime-internal-jit-icache-coherence]
opt-level = "z"
[profile.release.package.wasmparser]
opt-level = "z"
[profile.release.package.wasmprinter]
opt-level = "z"
[profile.release.package.regalloc2]
opt-level = "z"
[profile.release.package.gimli]
opt-level = "z"
[profile.release.package.object]
opt-level = "z"
[profile.release.package.naga]
opt-level = "z"

# Cached diagram, LaTeX math, and SVG rendering crates
[profile.release.package.mermaid-rs-renderer]
opt-level = "z"
[profile.release.package.latex-rust]
opt-level = "z"
[profile.release.package.usvg]
opt-level = "z"
[profile.release.package.resvg]
opt-level = "z"
[profile.release.package.tiny-skia]
opt-level = "z"
[profile.release.package.tiny-skia-path]
opt-level = "z"
[profile.release.package.rustybuzz]
opt-level = "z"
[profile.release.package.skrifa]
opt-level = "z"

# Async image decoders
[profile.release.package.exr]
opt-level = "z"
[profile.release.package.image]
opt-level = "z"
[profile.release.package.image-webp]
opt-level = "z"
[profile.release.package.zune-jpeg]
opt-level = "z"

# Network, TLS, config, file dialogs, and compression
[profile.release.package.ureq]
opt-level = "z"
[profile.release.package.rustls]
opt-level = "z"
[profile.release.package.rustls-webpki]
opt-level = "z"
[profile.release.package.ring]
opt-level = "z"
[profile.release.package.webpki-roots]
opt-level = "z"
[profile.release.package.rfd]
opt-level = "z"
[profile.release.package.toml]
opt-level = "z"
[profile.release.package.toml_parser]
opt-level = "z"
