[package]
name = "inviscid"
version = "0.1.0"
edition = "2024"

[lib]
name = "inviscid"
path = "src/lib.rs"

[[bin]]
name = "inviscid"
path = "src/main.rs"
test = false

[dependencies]
anyhow = "1.0"
dirs = "7.0.0"
futures = "0.3"
gpui = "0.2.2"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.6"
ureq = { version = "3.4.2", features = ["rustls"] }
rust-embed = { version = "8", features = ["include-exclude"] }
trash = { version = "5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }


[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell"] }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
